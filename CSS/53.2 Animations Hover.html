<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .gola{
            width: 100px;
            height: 100px;
            background: red;
            transition: width 2s;          /* # So, NOW WHEN WE WILL HOVER OVER BOX THEN WIDTH WILL BE*/ 
        }                                  /* # THEN WIDTH WILL CHANGE TO 300px*/ 
        .gola:hover{                       /* # AND IT WILL TAKE TIME 300px */
            width: 300px;
        }
    </style>
</head>
<body>
    <div class="gola"></div>
</body>
</html>
