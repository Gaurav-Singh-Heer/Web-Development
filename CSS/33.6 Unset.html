<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inheritance</title>
    <style>
        body{
            color: aqua;
        }
        .class-1 a{
            color: inherit;
        }
        .class-2 a{
            color: initial;
        }
        .class-3 a{
            color: unset;
        }
    </style>
</head>
<!--Unset Link blue as we had used color:initial;   due to which as inhetitance was yes so by -->
<!--changing here inheritance will work  and by use of inheritance a tag ka parent li li ka-->
<!-- ul ,ul ka body and body color blue so this is how inheritance works-->

<body>
    <ul>
        <li>Default<a href="">Link</a>color</li>
        <li class="class-1">Inherited <a href=""> Link </a>color</li>
        <li class="class-2">Initial <a href=""> Link </a>color</li>
        <li class="class-3">Unset <a href=""> Link </a>color</li>
    </ul>
</body>
</html>
