<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Form</title>
    <style>
        div#layer1{
            z-index: 1;
            position: absolute;
            top: 8px;
            left: 8px;
            width: 250px;
            height: 120px;
            padding: 5px;
            border: 1px solid blue;
            background-color: green;
        }
        div#layer2{
            z-index: 2;
            position: absolute;
            top: 25px;
            left: 25px;
            width: 250px;
            height: 120px;
            padding: 5px;
            border: 1px solid blue;
            background-color: orange;
        }
        div#layer3{
            z-index: 3;
            position: absolute;
            top: 40px;
            left: 40px;
            width: 300px;
            height: 160px;
            padding: 5px;
            border: 1px solid cyan;
            background-color: aqua;
        }
        
    </style>
    <!-- USED Top left to stack one over another
    to use Z index we write position absolute fix sticky
    we cannot change it in default position -->
</head>
<body>
    <div id="layer1">
        <h1>Programming Code Examples</h1>
    </div>
    <div id="layer2">
