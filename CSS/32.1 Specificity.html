<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .favorite{
            color:red;
            font-weight: bold;
        }

        ul#summer-drinks li{
            font-size: 12px;
            color: black;
            font-weight: normal;
        }
    </style>
    <!--By hovering mouse over ul#summer-drinks  and .favorite we get to know  ul#summer-drinks-->
    <!-- has more specificity and hence it's style would be followed-->
    <title>Specificity</title>
</head>
<body>
    <ul id="summer-drinks">
        <li>Mountain-dew</li>
        <li class="favorite">Appy Fizz</li>
        <li>Jeeru</li>
    </ul>
</body>
</html>
