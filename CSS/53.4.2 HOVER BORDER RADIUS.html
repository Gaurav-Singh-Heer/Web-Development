<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .gola{
            width: 100px;
            height: 100px;
            background: red;
            transition: height 4s;          
            transition: width 2s;
            transition: border-radius 4s;

        }                                           
        .gola:hover{                                
            width: 300px;                        
            height: 300px;                         
            border-radius: 50%;  
        }
    </style>
</head>
<body>
    <div class="gola"></div>
</body>
</html>
