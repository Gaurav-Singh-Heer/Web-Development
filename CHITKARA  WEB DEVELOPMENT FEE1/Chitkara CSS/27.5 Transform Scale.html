<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>amination effect</title>
    <style>
        div {
            border: 1px solid black;
            width: 50px;
            height: 50px;
            background: rgb(0, 255, 76);
            transition: width 2s, height 4s;
            transform: scale(2,3);
            overflow:hidden;
        }
        div:hover {
            width: 300px;
            height: 110px;
        }
    </style>
</head>
<body>
    <div>This is the box</div>
</body>
</html>
