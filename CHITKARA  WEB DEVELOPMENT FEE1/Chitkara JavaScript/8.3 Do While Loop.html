<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greetings</title>
</head>
<body>
    <h1>Hey! Whats Up?</h1>

    <script>  //BY THIS WE CAN EXECUTE LOOP ATLEAST ONCE
        let n=prompt("Enter a number");
        let i=0;         // Or i=0
        do{
            document.write(i+"<br>");
            i++;
        }
        while(i<=20)
        let j=1;
        let sum=0;
        do{
            sum=sum+j;
            j++;
        }
        while(j<=n)
        console.log("The Sum of first "+n+" numbers is "+sum)
        document.write("The Sum of first "+n+" numbers is "+sum)
    </script>
</body>
</html>
<!-- While and for Loop are entry control loop

Do while is exit control loop -->
