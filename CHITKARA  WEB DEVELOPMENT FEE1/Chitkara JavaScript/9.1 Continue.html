<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greetings</title>
</head>
<body>
    <h1>Hey! Whats Up?</h1>

    <script>
        let text = "";
        let i = 0;
        while (i < 5) {
            i++;
            if (i === 3) continue;
            text += i + "<br>";
        }
        document.write(text)
        console.log(text)
    </script>
</body>
</html>
<!-- While and for Loop are entry control loop

Do while is exit control loop -->
