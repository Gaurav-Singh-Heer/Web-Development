<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Variables</h1>
    <script>
        c=prompt("Enter a Name:-")
        c=parseInt(c)
        function Factorial(b){
            if(b==0 || b==1){
                document.write(1)
            }
            else{
                let c=1
                for(let i=1;i<=b;i++){
                    // console.log("Hello,world!");
                    c=c*i;
                }
                document.write(c);
            }
            
        }
        Factorial(c)
    </script>
</body>
</html>
