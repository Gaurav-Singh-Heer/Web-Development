<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greetings</title>
</head>
<body>
    <h1>Hey! Whats Up?</h1>

    <script>
        let n=prompt("Enter a number");
        sum=0
        for (let i=1;i<=n;i++){
            k=prompt("Enter kro :");
            k=parseInt(k)
            if(k>0){
                sum=sum+k
            }
            if(k<0){
                break
            }
        }
        document.write("Sum is "+sum)
    </script>
</body>
</html>
<!-- While and for Loop are entry control loop

Do while is exit control loop -->
