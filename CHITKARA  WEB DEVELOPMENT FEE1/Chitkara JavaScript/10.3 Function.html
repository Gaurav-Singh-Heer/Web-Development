<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Variables</h1>
    <script>
        function square(x){
            return x*x;
        }
        
        x=prompt("Enter a Number:");
        x=parseInt(x)
        let sq=square(x);
        console.log(sq);
        document.write(sq+"<br>");

        let result=square(5);
        console.log(result);
        document.write(result);
    </script>
</body>
</html>
