<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greetings</title>
</head>
<body>
    <h1>Details of Fruits</h1>

    <script>
        var fruittype=prompt("Kya loge bhaiya: ");
        switch(fruittype){
            case "Narangi":
                console.log("Narangi is 60 rs Kilo");
                break;  
            case "Sabe":
                console.log("Sabe is 80 rs Kilo");
                break;  
            case "Kele":
                console.log("kele is 60 rs dozen");
                break;            
            case "Amrudh":
                console.log("Amrudh is 90 rs Kilo");
                break;  
            case "Aam":
                console.log("Aam is 300 rs dozen");
                break;    
            case "Papita":
                console.log("Papita is 150 rs Kilo");
                break;  
            default:
                console.log(`${fruittype} Aaj khatam kll ayega`)     //  Used backtick[above tab button] not cotes
                break;
        }
        console.log("Orr kuch Chahiye")
    </script>
</body>
</html>
