<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>prompt</title>
    <style>
        p{
            color: antiquewhite;
            font-size: large;
        }
    </style>
</head>
<body>
    <p>introduction for prompt</p>
    <script>
        input=prompt("enter the name");
        input1=Number(input)
        console.log(typeof input1);

        input2=parseInt(input1)
        console.log(typeof input2);
    </script>
</body>
</html>
