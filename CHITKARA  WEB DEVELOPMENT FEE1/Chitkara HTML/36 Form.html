<!DOCTYPE html>                  <!--write       <!DOCTYPE html>     or not no worries-->
<html>
    <head>
        <title>form</title>
    </head>
    
    <body bgcolor="gold">   
        <form action="">
            <h1>registeration form</h1>
            <h3>Information</h3>
            <p>First Name<input type="text" name="name" size="30" maxlength="20"></p>
            <p>Last Name<input type="text" name="last name" size="30" maxlength="20"></p>
            <p>Password<input type="password" name="password" size="30" maxlength="20"></p>
            <legend>Gender</legend>
            <p>
                <input type="radio" name="gender" >Male
                <input type="radio" name="gender" >Female
            </p>
            <legend>Language</legend>
            <p>
                <input type="checkbox" name="Language" >English
                <input type="checkbox" name="Language" >Hindi
                <input type="checkbox" name="Language" >Punjabi
                <input type="checkbox" name="Language" >French

            </p>
            <p>
                Comments<textarea rows="7" cols="10">Enter here...</textarea>
            </p>
            <p>
                upload CV <input type="file" name="f2">
            </p>
            <p> Fruits Name
                <select name="Fruits" id="Fruits">
                    <option value="">--Select a Fruit--</option> <!--IMP so that user can see that he has to select card-->
                    <option value="Mango">Mango</option>
                    <option value="Apple">Apple</option>
                    <option value="Banana">Banana</option>
                    
                </select>

            </p>
            <p>
                <input type="submit" Value="Register">
                <input type="reset" Value="Clear">
                <input type="button" Value="Ok">
            </p>
        </form>
        
         
    </body>
    <hr width="500">  
</html>
