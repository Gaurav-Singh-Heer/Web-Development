<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul{
            color: lightpink;
            
            /* background-image: linear-gradient(45deg,lightpink,lightcoral,lightgreen);/* 45 deg=right*/
           /* height: 50%; */
        }
        h1{
            color: lightgreen;
        }
        a{
            animation: bouncing 0.5s ease 0s infinite alternate both;    /*@keyframes bouncing */
            /* O IS DELAY infinite IS LOOP aliternate IS DIRECTION both IS FILM MODE PLAY PAUSE*/
            background: rgb(162, 87, 1);
            border-radius: 50%;
            display: inline-block;               /* VERY IMPORTANT TO BRING ANIMATION AT LITTLE CENTER */
            color: white;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 300;
            letter-spacing: 0.2rem;
            padding: 1em 2em 1.1em;
            position: relative;
            text-decoration: none;
            text-transform: uppercase;
            vertical-align: bottom;
            /* margin: 100px; */
        }
        @keyframes bouncing {       /* TO BRING SHADOW WHEN BOX COMES DOWN*/
            0%{
                bottom: 0;
                box-shadow: 0 0 5px rgb(0, 0, 0,0.5);    /* 0.5 is transparency */
            }
            100%{
                bottom: 50px;
                box-shadow: 0 50PX 50px rgb(0, 0, 0,0.1);
            }
        }
        h1{
            transform: translate(120px, 50);
        }

        div#end {
            border: 1px solid black;
            width: 50px;
            height: 50px;
            background: rgb(0, 255, 76);
            transition: width 2s, height 4s;
            overflow:hidden;
        }

        div#end:hover {
            width: 300px;
            height: 110px;
            background: pink;
        }
        @media only screen and (max-width: 600px) {
            body {
            background-color: rgb(16, 8, 110);
            }
        }

    </style>
</head>
