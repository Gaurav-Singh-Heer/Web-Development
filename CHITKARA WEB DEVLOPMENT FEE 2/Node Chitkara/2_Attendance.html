<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2>Attendance Form</h2>
        <!-- Attendance Form -->
        <form id="attendance-form">
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" placeholder="Enter student name" required>
            </div>
            <div class="mb-3">
                <label for="studentClass" class="form-label">Class</label>
                <input type="text" class="form-control" id="studentClass" placeholder="Enter class" required>
            </div>
            <div class="mb-3">
                <label for="date" class="form-label">Date</label>
                <input type="date" class="form-control" id="date" required>
            </div>
            <button type="submit" class="btn btn-primary">Submit Attendance</button>
        </form>
        <hr>
        <h3>Attendance Records</h3>
        <!-- Attendance List -->
        <ul id="attendanceList" class="list-group"></ul>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function loadAttendance() {
            // Retrieve attendance records from local storage, or create an empty array
            let attendanceRecords = JSON.parse(localStorage.getItem('attendance')) || [];

            // Get the attendance list element
            let attendanceList = document.getElementById('attendanceList');
            attendanceList.innerHTML = ''; // Clear the list

            // Loop through the records and display each
            attendanceRecords.forEach(record => {
                let listItem = document.createElement('li');
                listItem.classList.add('list-group-item');
                listItem.textContent = `Name: ${record.name}, Class: ${record.class}, Date: ${record.date}`;
                attendanceList.appendChild(listItem);
            });
        }

        // Load the attendance records when the page loads
        window.onload = loadAttendance;

        // Form submission handling
        document.getElementById('attendance-form').addEventListener('submit', function(e) {
            e.preventDefault();

            // Get form values
            let name = document.getElementById('name').value;
            let studentClass = document.getElementById('studentClass').value;
            let date = document.getElementById('date').value;

            // Retrieve or initialize attendance records
            let attendanceRecords = JSON.parse(localStorage.getItem('attendance')) || [];

            // Add new record
            attendanceRecords.push({ name: name, class: studentClass, date: date });

            // Save updated records to local storage
            localStorage.setItem('attendance', JSON.stringify(attendanceRecords));

            // Reload the attendance list
            loadAttendance();

            // Clear the form
            document.getElementById('attendance-form').reset();
        });
    </script>
</body>
</html>
