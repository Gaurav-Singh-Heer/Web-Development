<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter</title>
    <link rel="icon" href="logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alkatra:wght@400..700&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-image: linear-gradient(#DEF9C4, #9CDBA6, #50B498, #468585);
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        header, footer {
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }
        header img, footer img {
            height: 40px;
            width: 60px;
        }
        header nav a, footer nav a {
            color: #f3b456;
            text-decoration: none;
            margin: 0 15px;
        }
        header nav a:hover, footer nav a:hover {
            text-decoration: underline;
        }
        .banner {
            text-align: center;
            padding: 50px 20px;
            color: #333;
        }
        .banner h1 {
            font-size: 3em;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <header>
        <img src="logo.jpg" alt="Logo">
        <nav>
            <a href="index2.html">Home</a>
            <a href="gallery2.html">News</a>
        </nav>
    </header>
    <div class="banner">
        <h1>Welcome to Our Newsletter</h1>
        <p>Stay updated with the latest news and articles</p>
    </div>
    <footer>
        <img src="logo.jpg" alt="Logo">
        <nav>
            <a href="index2.html">Home</a>
            <a href="gallery2.html">News</a>
            <a href="mailto:gaurav1574.be23@chitkara.edu.in">Contact Us</a>
        </nav>
        <span>Made with ❤️ By GSH</span>
    </footer>
</body>
</html>
