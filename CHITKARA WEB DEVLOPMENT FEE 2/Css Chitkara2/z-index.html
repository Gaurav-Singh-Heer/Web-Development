<!DOCTYPE html>
<html>
<head>
<style>
    #pic2{
        position: absolute;
        left: 0px;
        top: 0px;
        z-index: -3;
    }
    #pic{
        position: absolute;
        left: 0px;
        top: 150px;
        z-index: 3;
    }
</style>
</head>
<body>

    <h1>The z-index Property</h1>

    <img id="pic2" src="https://www.w3schools.com/cssref/w3css.gif" width="100" height="140">

    <p>Because the image has a z-index of -1, it will be placed behind the heading.</p>
    <br>
    <br>
    <br>
    <h1>The z-index Property</h1>

    <img id="pic" src="https://www.w3schools.com/cssref/w3css.gif" width="100" height="140">

    <p>Because the image has a z-index of -1, it will be placed behind the heading.</p>

</body>
</html>
