<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Page</title>
    <link rel="icon" href="img/logo.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            scroll-behavior: smooth;
        }

        header {
            background-color: #333;
            color: #fff;
            padding: 1em 2em;
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        header a {
            color: #fff;
            text-decoration: none;
        }

        header nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }

        header nav ul li {
            margin: 0 15px;
        }

        header nav ul li a {
            text-decoration: none;
            color: #9f9f9f;
            font-weight: bold;
            transition: color 0.3s;
            font-family: 'Oswald', sans-serif;
        }

        header nav ul li a:hover {
            color: #fff;
        }

        img.logo {
            height: 50px;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        .order-body {
            padding: 5vh;
            max-width: 50vw;
            width: 100%;
            margin: auto;
        }

        h2 {
            text-align: center;
            font-family: math;
            font-size: 1.8rem;
        }

        .order-container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.25),
                0 10px 10px rgba(0, 0, 0, 0.22);
            padding: 30px;
            margin-top: 20px;
        }

        .order-container h1 {
            margin-bottom: 20px;
            text-align: center;
            font-size: 28px;
            color: #333;
        }

        .order-container label {
            margin: 10px 0 5px;
            font-weight: bold;
            color: #555;
        }

        .order-container input,
        .order-container select,
        .order-container textarea {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            width: 100%;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        .order-container input:focus,
        .order-container select:focus,
        .order-container textarea:focus {
            border-color: #017143;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
        }

        .order-container button {
            background-color: #017143;
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            font-family: 'Roboto', sans-serif;
            width: 100%;
            text-transform: uppercase;
        }

        .order-container button:hover {
            background-color: #025e43;
        }

        .order-container button:active {
            transform: scale(0.98);
        }

        footer {
            background-color: #333;
            color: #fff;
            font-size: 14px;
            text-align: center;
            padding: 15px;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
        }

        footer p {
            margin: 0;
        }

        footer .footer-info span {
            color: #017143;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            header nav ul {
                flex-direction: column;
                align-items: center;
            }

            header nav ul li {
                margin: 10px 0;
            }

            footer nav ul {
                flex-direction: column;
                align-items: center;
            }

            footer nav ul li {
                margin: 10px 0;
            }

            .hidden {
                display: none;
            }

            img.menu {
                width: 100%;
                height: auto;
                max-width: 67vw;
            }
        }
    </style>
</head>

<body>
    <header>
        <a href="index.html">
            <img src="img/logo.png" alt="brewster logo" class="logo" />
        </a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="order-body">
        <h2>Order Your Favorite Drink</h2>
        <div class="order-container">
            <form action="#" method="POST">
                <h1>Place Your Order</h1>
                <label for="name">Name:</label>
                <input type="text" id="name" placeholder="Your Name" required />

                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Your Email" required />

                <label for="drink">Select Drink:</label>
                <select id="drink" required>
                    <option value="">--Select a Drink--</option>
                    <option value="Chai Tea Latte">Chai Tea Latte</option>
                    <option value="Salted Caramel Cold Brew">Salted Caramel Cold Brew</option>
                    <option value="Iced Signature Chocolate">Iced Signature Chocolate</option>
                    <option value="Chocolate Cappuccino">Chocolate Cappuccino</option>
                    <option value="Iced Caffe Latte">Iced Caffe Latte</option>
                    <option value="Doppio Espresso">Doppio Espresso</option>
                    <option value="Iced Caffè Americano">Iced Caffè Americano</option>
                    <option value="Hazelnut Cortado">Hazelnut Cortado</option>
                    <option value="Chocolate Cortado">Chocolate Cortado</option>
                    <option value="Caffe Americano">Caffe Americano</option>
                    <option value="Cold coffee">Cold coffee</option>
                    <option value="Caramel Java Chip Frappuccino">Caramel Java Chip Frappuccino</option>
                    <option value="Caffè Mocha">Caffè Mocha</option>
                    <option value="Caramel Macchiato">Caramel Macchiato</option>
                    <option value="Coffee Frappuccino">Coffee Frappuccino</option>
                    <option value="Rauch Organic Apple Juice">Rauch Organic Apple Juice</option>
                    <option value="Rauch Blueberry Juice">Rauch Blueberry Juice</option>
                    <option value="Rauch Pineapple Juice">Rauch Pineapple Juice</option>
                </select>

                <label for="size">Size:</label>
                <select id="size" required>
                    <option value="">--Select Size--</option>
                    <option value="small">Small</option>
                    <option value="medium">Medium</option>
                    <option value="large">Large</option>
                </select>

                <label for="special-request">Special Requests:</label>
                <textarea id="special-request" placeholder="Any special requests?" rows="4"></textarea>

                <button type="submit">Place Order</button>
            </form>
        </div>
    </main>

</body>
<footer>
    <div class="footer-info">
        <p>&copy; 2024 Brewster Coffee | Made with ❤️ by <span>Gaurav Singh Heer</span></p>
    </div>
</footer>

</html>
