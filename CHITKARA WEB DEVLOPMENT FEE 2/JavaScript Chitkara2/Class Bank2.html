<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Account</title>
</head>
<body>
    <h1>Bank Account Information</h1>
    
    <form id="accountForm">
        <label for="accountHolderName">Enter Account Holder's Name:</label>
        <input type="text" id="accountHolderName" name="accountHolderName" required>
        <button type="submit">Show Details</button>
    </form>

    <div id="accountInfo"></div>

    <script>
        class BankAccount {
            constructor(accountHolder, accountNo, initialAmount) {
                this.accountHolder = accountHolder;
                this.accountNo = accountNo;
                this.balance = initialAmount;
            }

            displayAccountInfo() {
                return `
                    <p><strong>Account Holder:</strong> ${this.accountHolder}</p>
                    <p><strong>Account Number:</strong> ${this.accountNo}</p>
                    <p><strong>Current Balance:</strong> ₹${this.balance}</p>
                `;
            }

            deposit(amount) {
                this.balance += amount;
                console.log(`Deposited ₹${amount}. New Balance: ₹${this.balance}`);
            }

            withdraw(amount) {
                if (amount > this.balance) {
                    console.log(`Insufficient funds. Withdrawal of ₹${amount} failed.`);
                } else {
                    this.balance -= amount;
                    console.log(`Withdrew ₹${amount}. New Balance: ₹${this.balance}`);
                }
            }
        }

        // Create some bank accounts
        const accounts = [
            new BankAccount("Arshiya", 123456789, 200),
            new BankAccount("Agam", 123450775, 1200),
            new BankAccount("Gaurav", 123453518, 1900)
        ];

        // Handle form submission
        document.getElementById('accountForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const name = document.getElementById('accountHolderName').value;
            const account = accounts.find(acc => acc.accountHolder.toLowerCase() === name.toLowerCase());

            const accountInfoDiv = document.getElementById('accountInfo');

            if (account) {
                accountInfoDiv.innerHTML = account.displayAccountInfo();
            } else {
                accountInfoDiv.innerHTML = `<p style="color:red;">No account found for the name "${name}".</p>`;
            }
        });
    </script>
</body>
</html>
