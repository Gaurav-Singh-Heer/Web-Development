<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
    <style>
        body {
            background-color: #444;
            color: #fff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            max-width: 600px;
        }
        .card {
            width: 80px;
            height: 80px;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            cursor: pointer;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, background-color 0.2s;
        }
        .card:hover {
            transform: scale(1.1);
            background-color: #999;
        }
        .hidden {
            visibility: hidden;
        }
        .stats {
            margin-top: 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div class="container" id="game-container"></div>
    <div class="stats">
        <p id="clicks">Total Clicks: 0</p>
        <p id="correct-clicks">Correct Clicks: 0</p>
        <p id="accuracy">Accuracy: 0%</p>
    </div>
    <script>
        const emojis = ['🍇', '🍉', '🍊', '🍋', '🍌', '🍎'];
        const cards = [...emojis, ...emojis];
        let flippedCards = [];
        let matchedCards = [];
        let clickDisabled = false;
        let totalClicks = 0;
        let correctClicks = 0;

        function createCard(emoji) {
            const card = document.createElement('div');
            card.classList.add('card');
            card.innerHTML = `<span class="hidden">${emoji}</span>`;
            card.addEventListener('click', () => flipcard(card));
            return card;
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function updateStats() {
            const accuracy = totalClicks > 0 ? ((correctClicks / totalClicks) * 100).toFixed(2) : 0;
            document.getElementById('clicks').innerText = `Total Clicks: ${totalClicks}`;
            document.getElementById('correct-clicks').innerText = `Correct Clicks: ${correctClicks}`;
            document.getElementById('accuracy').innerText = `Accuracy: ${accuracy}%`;
        }

        function flipcard(card) {
            if (clickDisabled || card === flippedCards[0]) return;
            card.firstChild.classList.remove('hidden');
            flippedCards.push(card);
            totalClicks++;
            updateStats();

            if (flippedCards.length === 2) {
                clickDisabled = true;
                setTimeout(() => {
                    const [card1, card2] = flippedCards;
                    if (card1.firstChild.innerText === card2.firstChild.innerText) {
                        matchedCards.push(card1, card2);
                        correctClicks++;
                        updateStats();
                        if (matchedCards.length === cards.length) {
                            alert('You win!');
                        }
                    } else {
                        card1.firstChild.classList.add('hidden');
                        card2.firstChild.classList.add('hidden');
                    }
                    flippedCards = [];
                    clickDisabled = false;
                }, 1000);
            }
        }

        function initializeGame() {
            const container = document.getElementById('game-container');
            shuffle(cards).forEach(emoji => {
                const card = createCard(emoji);
                container.appendChild(card);
            });
        }

        initializeGame();
    </script>
</body>
</html>
