<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript" src="script.js"></script>
</head>

<body>
    <p id="output"> </p>
    <script>
        function mult(a,b,c){
            let res=a*b*c;
            return res;
        }
        let ans=mult(2,3,4);
        document.getElementById("output").innerHTML="The multiplication of 2,3 and 4 is "+ans;
        document.body.style.background = "lightcoral";
    </script>
</body>

</html>
