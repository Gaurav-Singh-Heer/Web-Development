<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Quiz Game</h1>
    </header>

    <div class="quiz-container">
        <div id="question-container">
            <div id="question">Question Text</div>
            <div id="answer-buttons" class="btn-container">
                <p>A</p><button class="btn">Answer 1</button>
                <p>B</p><button class="btn">Answer 2</button>
                <p>C</p><button class="btn">Answer 3</button>
                <p>D</p><button class="btn">Answer 4</button>
            </div>
        </div>
        <button id="submit-btn" class="submit-btn">Submit</button>
        <div id="result"></div>
    </div>

    <footer>
        <p>&copy; 2024 Gaurav Singh Heer. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
