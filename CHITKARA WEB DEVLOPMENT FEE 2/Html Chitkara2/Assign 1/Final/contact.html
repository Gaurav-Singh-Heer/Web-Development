<body bgcolor="antiquewhite">
    <br>
    <br>
    <form>
        <div align="center">
            <label for="fname">First Name:</label><br>
            <input type="text" id="fname" name="fname" required>
        </div>
        <br>
        <div align="center">
            <label for="lname">Last Name:</label><br>
            <input type="text" id="lname" name="lname" required>
        </div>
        <br>
        <div align="center">
            <label for="mail">Email:</label><br>
            <input type="email" name="mail" required>
        </div>
        <br>
        <div align="center">
            <label for="book">Book Name:</label><br>
            <input type="text" name="book" required>
        </div>
        <br>
        <div align="center">
            <label for="genre">Genre:</label><br>
            <select name="genre" >
                <option value="Select">Select</option>
                <option value="fiction">Fiction</option>
                <option value="non-fiction">Non-Fiction</option>
                <option value="fantasy">Fantasy</option>
                <option value="sci-fi">Sci-Fi</option>
                <option value="mystery">Mystery</option>
                <option value="Other">Other..</option>
            </select>
        </div>
        <br>
        <div align="center">
            <label for="review">Review:</label><br>
            <textarea name="review"placeholder="Write a review about this book" rows="4.5" cols="50"></textarea>
        </div>
        <br>
        <div align="center" text-align="center">
            <button type="reset">Reset</button>
            <button type="submit"><a href="books2.html">Submit</a></button>
        </div>
    </form>
    <br><br>
