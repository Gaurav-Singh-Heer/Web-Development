<!DOCTYPE html>
<html>
<head>
	<title>DOM Search</title>
</head>
<body>
	<header>
		<h1>PRACTICE</h1>
	</header>
	<div class="myClass">Hello World!</div>
	<div class="myClass">Hello Again!</div>
	
	<script>
	  const myElements = document.getElementsByClassName('myClass');
	  myElements[0].style.backgroundColor = 'red';
	</script>
	
</body>
</html>
