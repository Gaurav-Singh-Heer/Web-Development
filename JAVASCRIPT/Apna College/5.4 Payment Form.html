<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables</title>
</head>
<body>
    BUILDING A PAYMENT FORM
</body>
<script>
    //Naming Convention

    //Camelcase
    let firstName="Yash";

    //PascalCase
    let LastName ="Bothra";

    //SnakeCase
    let middle_name =" Raj ";

    // Using Constant (const Keyword)
    const price=99;

    //Course name (String)
    var courseName = "Java DS/Algo Course";

    //Card Number(Number)
    var cardNumber ="1234567890";

    //Payment Status(Boolean)
    var isPaid=true;

    //Declaring a Variable
    var modeOfPayment;

    //Taking Input From User
    modeOfPayment=prompt("Mode of Payment?");
    
    //Output to User
    alert(firstName+" successfully bought "+courseName + " using "+ modeOfPayment);
    
</script>
</html>
