<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 20px;
            padding: 0 20px 30px 0;
            line-height: 1.4;
        }

        div#A{
            display: flex;
            flex-wrap: wrap;
        }
        p{
            border: 3px;
            border-color: black;
            padding: 1em 2em 1em;
            background: lightcoral;
        }
        #flex-item1{
            background: lightgreen;
        }
        #flex-item2{
            background: lightpink;
        }
        #flex-item3{
            background: lightgray;
        }
        #flex-item4{
            background: lightskyblue;
        }
        #flex-item5{
            background: lightgoldenrodyellow;
        }
        #flex-item6{
            background: lightslategrey;
        }
        
        .flex-item{
            width: 75px;
            height: 75px;
            background-color: lightblue;
            border: 2px solid darkblue;
            text-align: center;
            font-size: 2em;
            color: white;
            font-weight: bold;
            line-height: 1.4;
        }

    </style>
</head>
<body>
    <div id="A">
        <p id="flex-item1">Dabba 1</p>
        <p id="flex-item2">Dabba 2</p>
        <p id="flex-item3">Dabba 3</p>
        <p id="flex-item4">Dabba 4</p>
        <p id="flex-item5">Dabba 5</p>
        <p id="flex-item6">Dabba 6</p>
    </div>
</body>
</html>
