<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .flex-container{
            display: flex;
            justify-content: center; /* for right and left space */
            align-items: center;     /*for up and down space*/
            height:300px;   /* IMP TO USE align-items*/
            border: 1px solid black;
            
        }
        #flex-item-1{
            background-color: lightcorboal;
        }
        #flex-item-2{
            background-color: lightpink;
        }
        #flex-item-3{
            background-color: lightgreen;
        }
        #flex-item-4{
            background-color: lightseagreen;
        }
        #flex-item-5{
            background-color: lightslategrey;
        }
    </style>
</head>
<body>
    <div class="flex-container" >
        <div class="flex-item" id="flex-item-1">1</div>
        <div class="flex-item" id="flex-item-2">2</div>
        <div class="flex-item" id="flex-item-3">3</div>
        <div class="flex-item" id="flex-item-4">4</div>
        <div class="flex-item" id="flex-item-5">5</div>
    </div>
</body>
</html>
