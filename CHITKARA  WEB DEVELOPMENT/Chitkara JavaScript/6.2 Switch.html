<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greetings</title>
</head>
<body>
    <h1>Details of Fruits</h1>

    <script>
        var age=prompt("Age kya hai bhaiya: ");
        switch(age){
            case "age is 10":
                document.write("Narangi is 60 rs Kilo");
                break;  
            case "age is 12":
                document.write("Sabe is 80 rs Kilo");
                break;  
            case "age is 14":
                document.write("kele is 60 rs dozen");
                break;            
            case "age is 16":
                document.write("Amrudh is 90 rs Kilo");
                break;  
            case "age is 18":
                document.write("Aam is 300 rs dozen");
                break;    
            case "age is 19":
                document.write("Papita is 150 rs Kilo");
                break;  
            default:
                document.write(`${age} Aaj khatam kll ayega`)     //  Used backtick[above tab button] not cotes
                break;
        }
        document.write("Orr kuch Chahiye")
    </script>
</body>
</html>
