<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greetings</title>
</head>
<body>
    <h1>Hey! Whats Up?</h1>

    <script>
        var time=prompt("Hey Whats the time: ");
        if(time>5 && time<17){
            alert("Good Morning :)")
        }
        else{
            alert("Good Evening :)")
        }
    </script>
</body>
</html>
