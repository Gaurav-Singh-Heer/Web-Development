<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let car = {
        name: "Swift",
        model: 500,
        color: "white",
        };
        document.write(car.name); // Using dot notation
        document.write(car["name"]+"<br>"); // Using bracket notation

        let prp=Object.keys(car)
        console.log(prp)

        //length of array
        for (let i of prp){
            document.write(i+"<br>")
        }
    </script>
</body>
</html>
