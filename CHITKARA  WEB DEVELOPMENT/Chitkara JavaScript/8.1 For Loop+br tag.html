<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greetings</title>
</head>
<body>
    <h1>Hey! Whats Up?</h1>

    <script>
        let n=prompt("Enter a number");
        // n=parseInt(n)
        for(let i=0;i<=10;i++){
            console.log("Hello",i)
            document.write("Hello"+i+"<br>")
        }
        let sum=0;
        for (let i=1;i<n;i++){
            sum=sum+i;
        }
        console.log("The Sum of first "+n+" numbers is "+sum)
        document.write("The Sum of first "+n+" numbers is "+sum)
    </script>
</body>
</html>
<!-- While and for Loop are entry control loop

Do while is exit control loop -->
