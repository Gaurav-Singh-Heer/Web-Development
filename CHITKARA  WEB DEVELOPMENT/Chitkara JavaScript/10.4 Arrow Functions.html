<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Variables</h1>
    <script>
        let sayHello = () => {
            console.log("Hello, world!");
            document.write("Hello, world!");
        }
        
        sayHello(); // calling/invoking the function
    </script>
</body>
</html>
