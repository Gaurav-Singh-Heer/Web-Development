<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Tutorial</title>
</head>
<body>
    <div class="container">This is my container</div>
    <script>
        let jsonObj={
            name:"Harry",
            channel:"CWH",
            friend:"Rohan Das",
            food:"Bhindi"
        }
        console.log(jsonObj);

        let myJsonStr=JSON.stringify(jsonObj);
        console.log(myJsonStr)

        myJsonStr=myJsonStr.replace("Harry","Larry");
        console.log(myJsonStr);

        newJsonObj=JSON.parse(myJsonStr);
        console.log(newJsonObj)
    </script>
</body>
</html>

<!--
JSON.stringify() is a method that converts a JavaScript object or value to a JSON string.

JSON.parse() is a method that parses a JSON string and converts it back into a JavaScript object.
-->
