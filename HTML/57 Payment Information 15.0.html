<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Form</title>
</head>
<body bgcolor="orange">
    <form action="">              <!--IN    action=""    WE GIVE SERVER LOCATION  -->
        <h1> Payment Form </h1>
        <h2> Contact Information</h2>
        <p>Name: <input type="text" name="name"></p>  
        <fieldset>
            <legend>Gender</legend>      <!--legend to give name of Wrap or Group-->
            <p>
                Male <input type ="radio" name="gender"  id="Male">
                Female <input type ="radio" name="gender"  id="Female">
            </p>
        </fieldset> <!--It is used to wrap or Group-->
        <p>Address: <textarea name="address" id="address" cols="100" rows="8">Enter Here...</textarea></p>
        <p> Email: <input type="email" name="email" id="email"></p>
        <p> Pincode: <input type="number" name="pincode" id="pincode"></p>

        <h2>Payment Information</h2>
        <p>Card Type:
            <select name="card_type" id="card_type">
                <option value="">--Select a Card Type--</option> <!--IMP so that user can see that he has to select card-->
                <option value="visa">Visa</option>
                <option value="rupay">Rupay</option>
                <option value="mastercard">MasterCard</option>
                
            </select>
        </p>
        <p>
            Card Number: <input type="number" name="card_number" id="card_number">
        </p>
        <p>
            Expiration Date: <input type="date" name="exp_date" id="exp_date">
        </p>
        <p>
            CVV: <input type="password" name="cvv" id="cvv">
        </p>

        <input type="submit" value="Pay Now">

    </form>               
</body>
</html>
