<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Form</title>
</head>
<body>
    <form action="">              <!--IN    action=""    WE GIVE SERVER LOCATION  -->
        <h1> Payment Form </h1>
        <h2> Contact Information</h2>
        <p>Name: <input type="text" name="name"></p>  
        <fieldset>
            <legend>Gender</legend>      <!--legend to give name of Wrap or Group-->
            <p>
                Male <input type ="radio" name="gender"  id="Male">
                Female <input type ="radio" name="gender"  id="Female">
            </p>
        </fieldset> <!--It is used to wrap or Group-->
        <p>
            Address: <textarea name="address" id="address" cols="100" rows="8"></textarea>
        </p>
        <p>
            Email: <input type="email" name="email" id="email">
        </p>
        <p>
            Pincode: <input type="number" name="pincode" id="pincode">
        </p>
    </form>               
</body>
</html>
